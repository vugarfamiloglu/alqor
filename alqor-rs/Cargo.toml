[package]
name = "alqor"
version = "2.3.0"
edition = "2021"
description = "Alqor proqramlaşdırma dilinin Rust implementasiyası (lekser, parser, icraçı)"
license = "MIT"

[[bin]]
name = "alqor-rs"
path = "src/main.rs"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
unicode-normalization = "0.1"
fancy-regex = "0.14"
corosensei = "0.3"
indexmap = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
