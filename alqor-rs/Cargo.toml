[package]
name = "alqor"
version = "2.3.1"
edition = "2021"
description = "Alqor proqramlaşdırma dilinin Rust implementasiyası (lekser, parser, icraçı)"
license = "MIT"

[[bin]]
name = "alqor-rs"
path = "src/main.rs"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
unicode-normalization = "0.1"
fancy-regex = "0.14"
indexmap = "2"
unicode_names2 = "1"
# Əlavə modullar (şifrə, sıxma) — saf Rust, wasm-da da işləyir
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
hmac = "0.12"
scrypt = { version = "0.11", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
miniz_oxide = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
corosensei = "0.3"
libc = "0.2"
getrandom = "0.3"
# http müştərisi (rustls TLS, saf Rust sertifikat kökləri)
ureq = { version = "2.12", default-features = false, features = ["tls"], optional = true }
idna = { version = "1", optional = true }

[features]
default = ["http", "sqlite"]
http = ["dep:ureq", "dep:idna"]
sqlite = []

[lib]
name = "alqor"
path = "src/lib.rs"
crate-type = ["rlib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"

# WebAssembly paketi (`wasm/qur.sh`): stek açılması yoxdur
[profile.wasm]
inherits = "release"
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
