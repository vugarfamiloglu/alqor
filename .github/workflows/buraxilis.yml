name: Buraxılış (Windows, Linux, macOS)

# `v2.3.0` kimi teq push ediləndə hər üç platforma üçün quraşdırıcılar
# qurulur, həqiqi Windows / Linux / macOS maşınlarında quraşdırılıb
# yoxlanır və GitHub Releases-ə yüklənir. Əl ilə də işə
# salmaq olar (Actions → Buraxılış → Run workflow) — onda yalnız artefakt.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: alqor-rs (Rust icraçısı — quraşdırıcıya daxil edilir)
        shell: pwsh
        working-directory: alqor-rs
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Paylama və quraşdırıcı
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          python alqorc/alqorc.py qur --alqor qurma
          if (-not (Test-Path qurma/AlqorQurasdirici-*.exe)) {
            Push-Location qurma
            & $iscc /Q (Get-ChildItem alqor-*.iss).Name
            Pop-Location
          }
          Get-ChildItem qurma | Format-Table Name, Length

      - name: Tüstü sınağı — səssiz quraşdır, işlət, sil
        shell: pwsh
        run: |
          $exe = (Get-ChildItem qurma/AlqorQurasdirici-*.exe).FullName
          Start-Process $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/TASKS=path,assoc","/LOG=quras.log" -Wait
          $kok = "$env:LOCALAPPDATA\Programs\Alqor"
          if (-not (Test-Path "$kok\bin\alqor.cmd")) { Get-Content quras.log; throw "quraşdırılmadı" }
          $yol = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($yol -notlike "*Alqor\bin*") { throw "PATH-a yazılmayıb: $yol" }
          if (-not (Test-Path "$kok\sened\index.html")) { throw "sənədlər yoxdur" }
          $env:Path = "$kok\bin;$env:Path"
          Set-Location $env:RUNNER_TEMP
          alqor yeni sinaq-layihesi --şablon konsol
          if ($LASTEXITCODE) { throw "alqor yeni" }
          Set-Location sinaq-layihesi
          alqor sına
          if ($LASTEXITCODE) { throw "alqor sına" }
          alqor qur
          if ($LASTEXITCODE) { throw "alqor qur" }
          alqor qur --exe
          if ($LASTEXITCODE) { throw "alqor qur --exe" }
          $exe2 = (Get-ChildItem qurma/*.exe).FullName
          $env:Path = ($env:Path -split ";" | Where-Object { $_ -notlike "*Alqor*" -and $_ -notlike "*Python*" }) -join ";"
          "dünya" | & $exe2
          if ($LASTEXITCODE) { throw ".exe işləmədi" }
          $env:Path = "$kok\bin;$env:Path"
          "yaz(`"Salam, Windows!`")" | Out-File -Encoding utf8 s.alq
          $c = alqor işlət s.alq
          if ($c -ne "Salam, Windows!") { throw "işlət: $c" }
          if (-not (Test-Path "$kok\bin\alqor-rs.exe")) { throw "alqor-rs.exe quraşdırılmayıb" }
          "gətir şifrə`nyaz(şifrə.heş(`"a`", `"md5`"))" | Out-File -Encoding utf8 r.alq
          $c = alqor işlət --motor rs r.alq
          if ($c -ne "0cc175b9c0f1b6a831c399e269772661") { throw "--motor rs: $c" }
          $c = alqor işlət --motor avto r.alq
          if ($c -ne "0cc175b9c0f1b6a831c399e269772661") { throw "--motor avto: $c" }
          Start-Process "$kok\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          Start-Sleep 3
          if (Test-Path "$kok\bin") { throw "silinmədi" }
          Write-Host "✓ quraşdır → yeni → sına → qur → .exe → işlət → sil"

      - uses: actions/upload-artifact@v4
        with:
          name: alqor-windows
          path: |
            qurma/AlqorQurasdirici-*.exe
            qurma/alqor-*-windows-portativ.zip

  linux:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: alqor-rs (x86_64, aarch64 — çarpaz)
        working-directory: alqor-rs
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gcc-aarch64-linux-gnu
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
          cargo build --release --target x86_64-unknown-linux-gnu
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
          CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc \
            cargo build --release --target aarch64-unknown-linux-gnu
      - name: Paylamalar (x86_64, aarch64)
        run: |
          python alqorc/alqorc.py qur --alqor qurma --platforma linux --arx x86_64
          python alqorc/alqorc.py qur --alqor qurma --platforma linux --arx aarch64
          ls -la qurma
      - name: Tüstü sınağı — .deb
        run: |
          sudo apt-get install -y ./qurma/alqor_*_amd64.deb
          cd "$RUNNER_TEMP"
          env -i HOME="$HOME" PATH=/usr/bin:/bin sh -c '
            set -e
            alqor versiya
            alqor yeni deb-layihe >/dev/null
            cd deb-layihe
            echo dünya | alqor işlət
            alqor sına
            alqor lint .
            alqor yerləşdir
            test -x /opt/alqor/bin/alqor-rs
            printf "gətir şifrə\\nyaz(şifrə.heş(\\"a\\", \\"md5\\"))\\n" > r.alq
            test "$(alqor işlət --motor rs r.alq)" = 0cc175b9c0f1b6a831c399e269772661
            test "$(alqor işlət --motor avto r.alq)" = 0cc175b9c0f1b6a831c399e269772661
            cd ..
            alqor yeni forma-layihe --şablon desktop >/dev/null
            cd forma-layihe
            test -f mənbə/Əsas.forma
            alqor sına
            alqor qur'
          test -f /usr/share/applications/alqor-studio.desktop
          sudo apt-get remove -y alqor
          test ! -e /usr/bin/alqor
      - name: Tüstü sınağı — .tar.gz (sudo-suz)
        run: |
          T="$RUNNER_TEMP/tar"; mkdir -p "$T/ev"; cd "$T"
          tar xzf "$GITHUB_WORKSPACE"/qurma/alqor-*-linux-x86_64.tar.gz
          env -i HOME="$T/ev" PATH=/usr/bin:/bin sh alqor-*/qurasdir.sh
          env -i HOME="$T/ev" PATH="$T/ev/.local/bin:/usr/bin:/bin" sh -c '
            set -e
            cd "$HOME"
            alqor yeni t >/dev/null
            cd t
            echo dünya | alqor işlət
            echo dünya | alqor işlət --motor rs
            alqor qur'
          env -i HOME="$T/ev" PATH=/usr/bin:/bin sh "$T/ev/.local/share/alqor/sil.sh"
          test ! -e "$T/ev/.local/bin/alqor"
      - uses: actions/upload-artifact@v4
        with:
          name: alqor-linux
          path: |
            qurma/alqor-*-linux-*.tar.gz
            qurma/alqor_*.deb

  macos:
    runs-on: macos-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: alqor-rs (aarch64, x86_64)
        working-directory: alqor-rs
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Paylamalar (aarch64, x86_64)
        run: |
          python alqorc/alqorc.py qur --alqor qurma --platforma macos --arx aarch64
          python alqorc/alqorc.py qur --alqor qurma --platforma macos --arx x86_64
          ls -la qurma
      - name: Tüstü sınağı — .dmg açılır, Studio.app içində Python işləyir
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/alqor-dmg qurma/Alqor-*-macos-aarch64.dmg
          ls -la /tmp/alqor-dmg
          APP="/tmp/alqor-dmg/Alqor Studio.app"
          test -x "$APP/Contents/MacOS/alqor-studio"
          "$APP/Contents/Resources/alqor/bin/alqor" versiya
          "$APP/Contents/Resources/alqor/bin/alqor-rs" versiya
          hdiutil detach /tmp/alqor-dmg
      - name: Tüstü sınağı — .tar.gz + qurasdir.sh
        run: |
          T="$RUNNER_TEMP/mac"; mkdir -p "$T/ev"; cd "$T"
          tar xzf "$GITHUB_WORKSPACE"/qurma/alqor-*-macos-aarch64.tar.gz
          env -i HOME="$T/ev" PATH=/usr/bin:/bin sh alqor-*/qurasdir.sh
          test -d "$T/ev/Applications/Alqor Studio.app"
          env -i HOME="$T/ev" PATH="$T/ev/.local/bin:/usr/bin:/bin" sh -c '
            set -e
            cd "$HOME"
            alqor yeni t >/dev/null
            cd t
            echo dünya | alqor işlət
            echo dünya | alqor işlət --motor rs
            alqor sına
            alqor yerləşdir'
      - uses: actions/upload-artifact@v4
        with:
          name: alqor-macos
          path: |
            qurma/Alqor-*-macos-*.dmg
            qurma/alqor-*-macos-*.tar.gz

  rust:
    # alqor-rs: sürətli icraçı (konsol proqramları) və WebAssembly paketi
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  hedef: x86_64-unknown-linux-gnu, ad: linux-x86_64 }
          - { os: windows-latest, hedef: x86_64-pc-windows-msvc,   ad: windows-x86_64 }
          - { os: macos-latest,   hedef: aarch64-apple-darwin,     ad: macos-aarch64 }
          - { os: macos-latest,   hedef: x86_64-apple-darwin,      ad: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: alqor-rs
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup target add ${{ matrix.hedef }}
      - name: Qurma
        run: cargo build --release --target ${{ matrix.hedef }}
      - name: Paket və tüstü sınağı
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          Q="alqor-rs-$V-${{ matrix.ad }}"
          mkdir -p "../qurma/$Q"
          SON=""; [ "${{ runner.os }}" = "Windows" ] && SON=".exe"
          cp "target/${{ matrix.hedef }}/release/alqor-rs$SON" "../qurma/$Q/"
          printf '%s\n' \
            "alqor-rs $V — Alqor dilinin Rust icraçısı (Python icraçısından 20–40 dəfə sürətli)." \
            "" \
            "  alqor-rs işlət proqram.alq      proqramı işlədir" \
            "  alqor-rs versiya" \
            "" \
            "Konsol, veb (server, http), verilənlər (SQLite), şifrə, csv, toml, xml və s." \
            "modulları dəstəklənir; pəncərə və vidjet üçün əsas Alqor quraşdırıcısını" \
            "istifadə edin (\`alqor işlət --motor avto\`). Sənədlər: https://vuqar.pro/alqor" \
            > "../qurma/$Q/OXU.txt"
          if [ "${{ matrix.hedef }}" != "x86_64-apple-darwin" ]; then
            "../qurma/$Q/alqor-rs$SON" versiya
            "../qurma/$Q/alqor-rs$SON" run ../numuneler/02-dovrler.alq > cixis.txt
            cat cixis.txt; grep -q "Rəqəm: 5" cixis.txt
          fi
          cd ../qurma
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$Q.zip" "$Q" >/dev/null
          else
            tar czf "$Q.tar.gz" "$Q"
          fi
          rm -rf "$Q"; ls -la
      - name: WebAssembly paketi
        if: matrix.ad == 'linux-x86_64'
        run: |
          rustup target add wasm32-unknown-unknown
          sh wasm/qur.sh
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          node wasm/sina.mjs ../numuneler/02-dovrler.alq | grep -q "Rəqəm: 5"
          mkdir -p "../qurma/alqor-wasm-$V"
          cp wasm/alqor.wasm wasm/alqor.js wasm/index.html "../qurma/alqor-wasm-$V/"
          cd ../qurma && zip -qr "alqor-wasm-$V.zip" "alqor-wasm-$V" && rm -rf "alqor-wasm-$V"
      - uses: actions/upload-artifact@v4
        with:
          name: alqor-rs-${{ matrix.ad }}
          path: |
            qurma/alqor-rs-*
            qurma/alqor-wasm-*.zip

  buraxilis:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: fayllar
          merge-multiple: true
      - run: ls -la fayllar
      - uses: actions/checkout@v4
        with:
          path: mənbə
          sparse-checkout: .github
      - name: Yoxlama cəmləri
        run: cd fayllar && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: Alqor ${{ github.ref_name }}
          files: fayllar/*
          body_path: mənbə/.github/buraxilis-qeydleri.md
