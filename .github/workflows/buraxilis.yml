name: Buraxılış (Windows, Linux, macOS)

# `v2.3.0` kimi teq push ediləndə hər üç platforma üçün quraşdırıcılar
# qurulur, həqiqi Windows / Linux / macOS maşınlarında quraşdırılıb
# yoxlanır və GitHub Releases-ə yüklənir. Əl ilə də işə
# salmaq olar (Actions → Buraxılış → Run workflow) — onda yalnız artefakt.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paylama və quraşdırıcı
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          python alqorc/alqorc.py qur --alqor qurma
          if (-not (Test-Path qurma/AlqorQurasdirici-*.exe)) {
            Push-Location qurma
            & $iscc /Q (Get-ChildItem alqor-*.iss).Name
            Pop-Location
          }
          Get-ChildItem qurma | Format-Table Name, Length

      - name: Tüstü sınağı — səssiz quraşdır, işlət, sil
        shell: pwsh
        run: |
          $exe = (Get-ChildItem qurma/AlqorQurasdirici-*.exe).FullName
          Start-Process $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/TASKS=path,assoc","/LOG=quras.log" -Wait
          $kok = "$env:LOCALAPPDATA\Programs\Alqor"
          if (-not (Test-Path "$kok\bin\alqor.cmd")) { Get-Content quras.log; throw "quraşdırılmadı" }
          $yol = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($yol -notlike "*Alqor\bin*") { throw "PATH-a yazılmayıb: $yol" }
          if (-not (Test-Path "$kok\sened\index.html")) { throw "sənədlər yoxdur" }
          $env:Path = "$kok\bin;$env:Path"
          Set-Location $env:RUNNER_TEMP
          alqor yeni sinaq-layihesi --şablon konsol
          if ($LASTEXITCODE) { throw "alqor yeni" }
          Set-Location sinaq-layihesi
          alqor sına
          if ($LASTEXITCODE) { throw "alqor sına" }
          alqor qur
          if ($LASTEXITCODE) { throw "alqor qur" }
          alqor qur --exe
          if ($LASTEXITCODE) { throw "alqor qur --exe" }
          $exe2 = (Get-ChildItem qurma/*.exe).FullName
          $env:Path = ($env:Path -split ";" | Where-Object { $_ -notlike "*Alqor*" -and $_ -notlike "*Python*" }) -join ";"
          "dünya" | & $exe2
          if ($LASTEXITCODE) { throw ".exe işləmədi" }
          $env:Path = "$kok\bin;$env:Path"
          "yaz(`"Salam, Windows!`")" | Out-File -Encoding utf8 s.alq
          $c = alqor işlət s.alq
          if ($c -ne "Salam, Windows!") { throw "işlət: $c" }
          Start-Process "$kok\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          Start-Sleep 3
          if (Test-Path "$kok\bin") { throw "silinmədi" }
          Write-Host "✓ quraşdır → yeni → sına → qur → .exe → işlət → sil"

      - uses: actions/upload-artifact@v4
        with:
          name: alqor-windows
          path: |
            qurma/AlqorQurasdirici-*.exe
            qurma/alqor-*-windows-portativ.zip

  linux:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paylamalar (x86_64, aarch64)
        run: |
          python alqorc/alqorc.py qur --alqor qurma --platforma linux --arx x86_64
          python alqorc/alqorc.py qur --alqor qurma --platforma linux --arx aarch64
          ls -la qurma
      - name: Tüstü sınağı — .deb
        run: |
          sudo apt-get install -y ./qurma/alqor_*_amd64.deb
          cd "$RUNNER_TEMP"
          env -i HOME="$HOME" PATH=/usr/bin:/bin sh -c '
            set -e
            alqor versiya
            alqor yeni deb-layihe >/dev/null
            cd deb-layihe
            echo dünya | alqor işlət
            alqor sına
            alqor lint .
            alqor yerləşdir'
          test -f /usr/share/applications/alqor-studio.desktop
          sudo apt-get remove -y alqor
          test ! -e /usr/bin/alqor
      - name: Tüstü sınağı — .tar.gz (sudo-suz)
        run: |
          T="$RUNNER_TEMP/tar"; mkdir -p "$T/ev"; cd "$T"
          tar xzf "$GITHUB_WORKSPACE"/qurma/alqor-*-linux-x86_64.tar.gz
          env -i HOME="$T/ev" PATH=/usr/bin:/bin sh alqor-*/qurasdir.sh
          env -i HOME="$T/ev" PATH="$T/ev/.local/bin:/usr/bin:/bin" sh -c '
            set -e
            cd "$HOME"
            alqor yeni t >/dev/null
            cd t
            echo dünya | alqor işlət
            alqor qur'
          env -i HOME="$T/ev" PATH=/usr/bin:/bin sh "$T/ev/.local/share/alqor/sil.sh"
          test ! -e "$T/ev/.local/bin/alqor"
      - uses: actions/upload-artifact@v4
        with:
          name: alqor-linux
          path: |
            qurma/alqor-*-linux-*.tar.gz
            qurma/alqor_*.deb

  macos:
    runs-on: macos-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paylamalar (aarch64, x86_64)
        run: |
          python alqorc/alqorc.py qur --alqor qurma --platforma macos --arx aarch64
          python alqorc/alqorc.py qur --alqor qurma --platforma macos --arx x86_64
          ls -la qurma
      - name: Tüstü sınağı — .dmg açılır, Studio.app içində Python işləyir
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/alqor-dmg qurma/Alqor-*-macos-aarch64.dmg
          ls -la /tmp/alqor-dmg
          APP="/tmp/alqor-dmg/Alqor Studio.app"
          test -x "$APP/Contents/MacOS/alqor-studio"
          "$APP/Contents/Resources/alqor/bin/alqor" versiya
          hdiutil detach /tmp/alqor-dmg
      - name: Tüstü sınağı — .tar.gz + qurasdir.sh
        run: |
          T="$RUNNER_TEMP/mac"; mkdir -p "$T/ev"; cd "$T"
          tar xzf "$GITHUB_WORKSPACE"/qurma/alqor-*-macos-aarch64.tar.gz
          env -i HOME="$T/ev" PATH=/usr/bin:/bin sh alqor-*/qurasdir.sh
          test -d "$T/ev/Applications/Alqor Studio.app"
          env -i HOME="$T/ev" PATH="$T/ev/.local/bin:/usr/bin:/bin" sh -c '
            set -e
            cd "$HOME"
            alqor yeni t >/dev/null
            cd t
            echo dünya | alqor işlət
            alqor sına
            alqor yerləşdir'
      - uses: actions/upload-artifact@v4
        with:
          name: alqor-macos
          path: |
            qurma/Alqor-*-macos-*.dmg
            qurma/alqor-*-macos-*.tar.gz

  buraxilis:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: fayllar
          merge-multiple: true
      - run: ls -la fayllar
      - name: GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: fayllar/*
          body: |
            ## Alqor ${{ github.ref_name }}

            Azərbaycan dilində proqramlaşdırma dili — dil, Alqor Studio IDE,
            paket meneceri, linter, formatter və oflayn sənədlər. Hər
            quraşdırıcıda Python daxildir, əlavə heç nə lazım deyil.

            ### Windows
            **AlqorQurasdirici-*.exe** — endirin və işə salın (idarəçi hüququ
            lazım deyil). Başlat menyusunda **Alqor Studio**, **Alqor
            terminalı**, **Alqor sənədləri**. Quraşdırmasız: **…-windows-portativ.zip**.

            ### Linux
            - Debian / Ubuntu: `sudo apt install ./alqor_*_amd64.deb` (ARM: `arm64`)
            - İstənilən distribusiya, sudo-suz: `tar xzf alqor-*-linux-x86_64.tar.gz && ./alqor-*/qurasdir.sh`

            ### macOS
            **Alqor-*-macos-aarch64.dmg** (Apple Silicon) və ya **…-x86_64.dmg**
            (Intel): «Alqor Studio»-nu Applications-a sürükləyin, ilk dəfə sağ
            klik → Open. Terminal əmrləri üçün `.tar.gz`-dəki `qurasdir.sh`.

            Sənədlər, nümunələr: https://alqor.vuqar.pro
